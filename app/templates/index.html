{% extends "base.html" %}
{% block content %}
<div class="row g-4">
    <!-- Key Generation Card -->
    <div class="col-lg-6">
        <div class="card h-100">
            <div class="card-header text-white bg-primary">
                <h5 class="mb-0"><i class="bi bi-key me-2"></i>Key Generation</h5>
            </div>
            <div class="card-body">
                <button id="generateKeysBtn" class="btn btn-primary w-100 mb-4">
                    <i class="bi bi-gear-wide-connected me-2"></i>
                    Generate New Keys
                </button>

                <div id="keyOutput" style="display: none;">
                    <div class="mb-3 position-relative">
                        <label class="form-label">Public Key</label>
                        <textarea class="form-control bg-light" rows="3" readonly 
                                  id="publicKey">{{ public_key }}</textarea>
                        <button type="button" class="btn btn-sm btn-outline-secondary copy-btn"
                                onclick="copyToClipboard('publicKey')">
                            <i class="bi bi-clipboard"></i>
                        </button>
                    </div>

                    <div class="position-relative">
                        <label class="form-label">Private Key</label>
                        <textarea class="form-control bg-light" rows="3" readonly 
                                  id="privateKey">{{ private_key }}</textarea>
                        <button type="button" class="btn btn-sm btn-outline-secondary copy-btn"
                                onclick="copyToClipboard('privateKey')">
                            <i class="bi bi-clipboard"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Encryption Card -->
    <div class="col-lg-6">
        <div class="card h-100">
            <div class="card-header text-white bg-success">
                <h5 class="mb-0"><i class="bi bi-lock me-2"></i>Encryption</h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    <input type="hidden" name="action" value="encrypt">
                    
                    <div class="mb-3">
                        <label class="form-label">Message to Encrypt</label>
                        <textarea name="message" class="form-control" 
                                  rows="2" placeholder="Enter secret message" required></textarea>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Public Key</label>
                        <textarea name="public_key" class="form-control" 
                                  rows="3" required>{{ public_key }}</textarea>
                    </div>
                    
                    <button class="btn btn-success w-100 mb-3">
                        <i class="bi bi-file-lock2 me-2"></i>
                        Encrypt Message
                    </button>

                    {% if original_message %}
                    <div class="crypto-section">
                        <label class="form-label">Original Message</label>
                        <textarea class="form-control" rows="2" readonly>{{ original_message }}</textarea>
                    </div>
                    {% endif %}

                    {% if kyber_ciphertext %}
                    <div class="crypto-section position-relative">
                        <label class="form-label">Kyber Ciphertext</label>
                        <textarea class="form-control bg-light" rows="3" readonly 
                                  id="kyberCiphertext">{{ kyber_ciphertext }}</textarea>
                        <button type="button" class="btn btn-sm btn-outline-secondary copy-btn"
                                onclick="copyToClipboard('kyberCiphertext')">
                            <i class="bi bi-clipboard"></i>
                        </button>
                    </div>
                    {% endif %}

                    {% if aes_ciphertext %}
                    <div class="crypto-section position-relative">
                        <label class="form-label">AES Ciphertext</label>
                        <textarea class="form-control bg-light" rows="3" readonly 
                                  id="aesCiphertext">{{ aes_ciphertext }}</textarea>
                        <button type="button" class="btn btn-sm btn-outline-secondary copy-btn"
                                onclick="copyToClipboard('aesCiphertext')">
                            <i class="bi bi-clipboard"></i>
                        </button>
                    </div>
                    {% endif %}

                    {% if encryption_shared_secret %}
                    <div class="crypto-section position-relative">
                        <label class="form-label">Encryption Shared Secret</label>
                        <textarea class="form-control bg-light" rows="2" readonly 
                                  id="encSharedSecret">{{ encryption_shared_secret }}</textarea>
                        <button type="button" class="btn btn-sm btn-outline-secondary copy-btn"
                                onclick="copyToClipboard('encSharedSecret')">
                            <i class="bi bi-clipboard"></i>
                        </button>
                    </div>
                    {% endif %}
                </form>
            </div>
        </div>
    </div>
